# ================================================================
#  Mosquitto MQTT Broker Configuration
#  File: /etc/mosquitto/conf.d/iot.conf
# ================================================================

# ─── Listeners ──────────────────────────────────────────────
listener 1883
protocol mqtt

# WebSocket support (for browser-based clients)
listener 9001
protocol websockets

# ─── Authentication ──────────────────────────────────────────
allow_anonymous false
password_file /etc/mosquitto/passwd
# Create users:
#   sudo mosquitto_passwd -c /etc/mosquitto/passwd iot_device
#   sudo mosquitto_passwd    /etc/mosquitto/passwd iot_logger_server

# ─── Persistence ─────────────────────────────────────────────
persistence true
persistence_location /var/lib/mosquitto/

# ─── Logging ─────────────────────────────────────────────────
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true

# ─── QoS & Message Limits ────────────────────────────────────
max_inflight_messages 20
max_queued_messages 200
message_size_limit 65536

# ─── Keep-Alive ──────────────────────────────────────────────
keepalive_interval 60
